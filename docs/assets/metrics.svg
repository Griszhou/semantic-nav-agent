<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 290"><rect width="1100" height="290" rx="20" fill="#08121f"/><g font-family="Segoe UI,Arial"><text x="45" y="42" fill="#e5f7ff" font-size="22" font-weight="700">Evaluation contract</text><text x="45" y="67" fill="#9bb6c7" font-size="14">The replay emits the same fields consumed by a ROS2 / rosbag2 evaluator.</text><g fill="#102a43" stroke="#244d67"><rect x="45" y="98" width="180" height="130" rx="12"/><rect x="255" y="98" width="180" height="130" rx="12"/><rect x="465" y="98" width="180" height="130" rx="12"/><rect x="675" y="98" width="180" height="130" rx="12"/><rect x="885" y="98" width="170" height="130" rx="12"/></g><g fill="#5eead4" font-size="19" font-weight="700" text-anchor="middle"><text x="135" y="139">SUCCESS</text><text x="345" y="139">SPL</text><text x="555" y="139">PATH</text><text x="765" y="139">REPLAN</text><text x="970" y="139">FRONTIER</text></g><g fill="#b8d4e2" font-size="14" text-anchor="middle"><text x="135" y="171">task complete</text><text x="135" y="195">boolean</text><text x="345" y="171">efficiency</text><text x="345" y="195">0 … 1</text><text x="555" y="171">travel cost</text><text x="555" y="195">grid cells</text><text x="765" y="171">recovery time</text><text x="765" y="195">milliseconds</text><text x="970" y="171">information gain</text><text x="970" y="195">candidate count</text></g></g></svg>
